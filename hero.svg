<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dipa — useful software, thoughtful details</title>
  <desc id="desc">D1paak's developer profile. A dark canvas with mint and blue accents, a gently moving orbital diagram, and a small code window.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#101B26"/><stop offset=".58" stop-color="#0D141D"/><stop offset="1" stop-color="#101B22"/></linearGradient>
    <linearGradient id="accent" x1="46" y1="0" x2="914" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8C6"/><stop offset=".5" stop-color="#79C8FF"/><stop offset="1" stop-color="#67E8C6" stop-opacity=".15"/></linearGradient>
    <linearGradient id="orbital" x1="640" y1="52" x2="882" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8C6"/><stop offset="1" stop-color="#79C8FF" stop-opacity=".12"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7CB4CE" fill-opacity=".12"/></pattern>
    <clipPath id="frame"><rect x=".5" y=".5" width="959" height="319" rx="24"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .orbit{transform-origin:770px 160px;animation:orbit 28s linear infinite}
    .signal{animation:signal 5s ease-in-out infinite}
    .cursor{animation:blink 1.6s steps(1,end) infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes signal{0%,100%{opacity:.35}50%{opacity:.95}}
    @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.signal,.cursor{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="960" height="320" rx="24" fill="url(#surface)"/>
    <rect x="574" width="386" height="320" fill="url(#dots)"/>
    <path d="M46 1H914" stroke="url(#accent)" stroke-width="3"/>
    <path d="M576 40V280" stroke="#263642" stroke-opacity=".55"/>
    <circle cx="770" cy="160" r="121" stroke="#243C48" stroke-opacity=".7"/>
    <circle cx="770" cy="160" r="98" stroke="#203441" stroke-dasharray="3 9"/>
    <g class="orbit"><circle cx="770" cy="160" r="121" stroke="url(#orbital)" stroke-dasharray="108 652" stroke-width="1.5"/><circle cx="770" cy="39" r="4" fill="#67E8C6"/><circle cx="770" cy="281" r="3" fill="#79C8FF"/></g>
    <text x="48" y="47" class="mono" font-size="12" letter-spacing="2.2" fill="#91A9B8">D1PAAK / SOFTWARE &amp; INTERFACES</text>
    <text x="43" y="146" class="sans" font-size="88" font-weight="700" letter-spacing="-4" fill="#F0F6FC">Dipa<tspan fill="#67E8C6">.</tspan></text>
    <text x="48" y="193" class="sans" font-size="25" font-weight="500" fill="#DBE7EF">Useful software. Thoughtful details.</text>
    <text x="49" y="226" class="sans" font-size="16" fill="#92A8B8">Desktop experiences / Web / Developer tools</text>
    <rect x="48" y="263" width="30" height="3" rx="1.5" fill="#67E8C6"/>
    <rect x="83" y="263" width="13" height="3" rx="1.5" fill="#79C8FF"/>
    <text x="110" y="269" class="mono" font-size="11" letter-spacing="1.6" fill="#849CAB">BUILD / LEARN / REFINE</text>
    <rect x="628" y="93" width="284" height="151" rx="13" fill="#0D151F" stroke="#2B414F"/>
    <path d="M629 129H911" stroke="#263947"/>
    <circle cx="647" cy="111" r="3.5" fill="#67E8C6" class="signal"/><circle cx="661" cy="111" r="3.5" fill="#79C8FF" fill-opacity=".6"/><circle cx="675" cy="111" r="3.5" fill="#537080"/>
    <text x="891" y="115" text-anchor="end" class="mono" font-size="10" fill="#7E97A8">workspace</text>
    <g class="mono" font-size="12"><text x="647" y="155" fill="#67E8C6">const <tspan fill="#DCE8F0">focus = {</tspan></text><text x="663" y="180" fill="#8FA8BB">code: <tspan fill="#B4DDF9">"make it useful"</tspan><tspan fill="#DCE8F0">,</tspan></text><text x="663" y="205" fill="#8FA8BB">design: <tspan fill="#B4DDF9">"make it clear"</tspan></text><text x="647" y="229" fill="#DCE8F0">};<tspan class="cursor" fill="#67E8C6"> ▍</tspan></text></g>
  </g>
  <rect x=".5" y=".5" width="959" height="319" rx="24" stroke="#2A3C48"/>
</svg>
